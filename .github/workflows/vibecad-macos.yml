name: VibeCAD macOS Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build."
        required: true
        default: "dev"
        type: string
      architecture:
        description: "macOS architecture to build."
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64
          - both
      publish_release:
        description: "Publish the successful macOS artifacts as a GitHub prerelease."
        required: true
        default: false
        type: boolean
      sign_release:
        description: "Use production Developer ID signing and Apple notarization."
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Optional release tag. Leave empty for vibecad-macos-YYYYMMDD-SHA."
        required: false
        type: string

concurrency:
  group: vibecad-macos-${{ inputs.source_ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

env:
  UPLOAD_RELEASE: "false"

jobs:
  prepare:
    name: Prepare macOS Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      release_version: ${{ steps.meta.outputs.release_version }}
      build_tag: ${{ steps.meta.outputs.build_tag }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Resolve source and architecture matrix
        id: meta
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          ARCHITECTURE: ${{ inputs.architecture }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve ${SOURCE_REF} to a commit: ${source_sha}" >&2
            exit 1
          fi

          version_output="$(python3 package/rattler-build/scripts/resolve_macos_bundle_version.py version.json)"
          release_version="${version_output%%|*}"
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve the release version: ${release_version}" >&2
            exit 1
          fi

          release_tag="${INPUT_RELEASE_TAG}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="vibecad-macos-$(date -u +%Y%m%d)-${source_sha:0:12}"
          fi
          if [[ ! "${release_tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag contains unsupported characters: ${release_tag}" >&2
            exit 1
          fi

          arm64='{"target":"osx-arm64","runner":"macos-15","arch":"arm64"}'
          x86_64='{"target":"osx-64","runner":"macos-15-intel","arch":"x86_64"}'
          case "${ARCHITECTURE}" in
            arm64)
              matrix="{\"include\":[${arm64}]}"
              ;;
            x86_64)
              matrix="{\"include\":[${x86_64}]}"
              ;;
            both)
              matrix="{\"include\":[${arm64},${x86_64}]}"
              ;;
            *)
              echo "Unsupported architecture selection: ${ARCHITECTURE}" >&2
              exit 1
              ;;
          esac

          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "build_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          Source: ${SOURCE_REF} @ ${source_sha}

          Architecture: ${ARCHITECTURE}

          Release tag: ${release_tag}

          Publish release: ${{ inputs.publish_release }}
          EOF

  macos:
    name: macOS ${{ matrix.arch }} DMG
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install Pixi
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "${HOME}/.pixi/bin" >> "${GITHUB_PATH}"

      - name: Restore Pixi and runtime caches
        id: cache-pixi
        uses: actions/cache/restore@v4
        with:
          path: |
            package/rattler-build/.pixi
            package/rattler-build/.download-cache
            ~/.cache/pixi
            ~/.cache/rattler
            ~/Library/Caches/pip
          key: pixi-${{ matrix.target }}-${{ hashFiles('package/rattler-build/pixi.lock', 'package/rattler-build/pixi.toml', 'package/rattler-build/recipe.yaml', 'src/Mod/VibeCAD/requirements.txt', 'src/Mod/VibeCAD/build123d-requirements.txt', 'package/rattler-build/scripts/install_vibecad_provider_deps.sh', 'package/rattler-build/scripts/install_vibecad_build123d_runtime.sh', 'package/rattler-build/scripts/install_vibecad_openscad_runtime.sh', 'package/rattler-build/scripts/install_vibecad_codex_runtime.sh', 'package/rattler-build/scripts/write_vibecad_build123d_manifest.py', 'package/rattler-build/scripts/relocate_conda_environment.py') }}
          restore-keys: |
            pixi-${{ matrix.target }}-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Remove restored local package products
        shell: bash
        working-directory: package/rattler-build
        run: |
          set -euo pipefail
          rm -rf -- .pixi/envs/default .pixi/envs/package
          pixi clean --build

      - name: Build package environment
        shell: bash
        working-directory: package/rattler-build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: "2G"
          MACOS_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          pixi install -e default
          pixi install -e package

      - name: Verify installed VibeCAD source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_vibecad_source_identity.py \
            --source src/Mod/VibeCAD \
            --installed package/rattler-build/.pixi/envs/default/Mod/VibeCAD

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Pixi and runtime caches
        if: always() && steps.cache-pixi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            package/rattler-build/.pixi
            package/rattler-build/.download-cache
            ~/.cache/pixi
            ~/.cache/rattler
            ~/Library/Caches/pip
          key: ${{ steps.cache-pixi.outputs.cache-primary-key }}

      - name: Reclaim macOS packaging workspace
        shell: bash
        working-directory: package/rattler-build
        run: |
          set -euo pipefail
          echo "Rattler build workspace before packaging cleanup:"
          du -sk .pixi/bld
          rm -rf .pixi/bld
          if [[ -d "${RUNNER_TEMP}/ccache" ]]; then
            echo "Compiler cache before packaging cleanup:"
            du -sk "${RUNNER_TEMP}/ccache"
            rm -rf "${RUNNER_TEMP}/ccache"
          fi
          echo "Runner disk space available for macOS packaging:"
          df -h .

      - name: Configure production signing and notarization
        if: ${{ inputs.sign_release }}
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CI_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.MACOS_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD UPDATE_SIGNING_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production signing secret is missing: ${name}" >&2
              exit 1
            fi
          done
          certificate="${RUNNER_TEMP}/vibecad-signing.p12"
          keychain="${RUNNER_TEMP}/vibecad-signing.keychain-db"
          printf '%s' "${CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          xcrun notarytool store-credentials VibeCAD-CI \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --keychain "${keychain}"
          echo "VIBECAD_CI_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"

      - name: Create and validate VibeCAD DMG
        timeout-minutes: 120
        shell: bash
        working-directory: package/rattler-build
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          MACOS_DEPLOYMENT_TARGET: "12.0"
          MACOS_SIGN_RELEASE: ${{ inputs.sign_release && 'true' || 'false' }}
          MACOS_SIGNING_KEY_ID: ${{ secrets.MACOS_SIGNING_KEY_ID }}
          MACOS_INSTALLER_SIGNING_KEY_ID: ${{ secrets.MACOS_INSTALLER_SIGNING_KEY_ID }}
          MACOS_KEYCHAIN_PROFILE: ${{ inputs.sign_release && 'VibeCAD-CI' || 'VibeCAD' }}
          VIBECAD_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VIBECAD_SOURCE_URI: https://github.com/${{ github.repository }}
          VIBECAD_BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VIBECAD_UPDATE_CHANNEL: prerelease
          VIBECAD_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release_tag }}
          VIBECAD_UPDATE_METADATA_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release_tag }}
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.MACOS_UPDATE_SIGNING_KEY_BASE64 }}
          UPLOAD_RELEASE: "false"
        run: |
          set -euo pipefail
          if [[ "${{ inputs.sign_release }}" == "true" ]]; then
            update_private_key="${RUNNER_TEMP}/vibecad-update-signing-for-bundle.pem"
            update_public_key="${RUNNER_TEMP}/vibecad-update-public.pem"
            printf '%s' "${UPDATE_SIGNING_KEY_BASE64}" | base64 --decode > "${update_private_key}"
            openssl pkey -in "${update_private_key}" -pubout -out "${update_public_key}"
            export VIBECAD_UPDATE_PUBLIC_KEY_PATH="${update_public_key}"
          fi
          pixi run -e package create_bundle

      - name: Sign update metadata
        if: ${{ inputs.sign_release }}
        shell: bash
        env:
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.MACOS_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/vibecad-update-signing.pem"
          printf '%s' "${UPDATE_SIGNING_KEY_BASE64}" | base64 --decode > "${key}"
          manifest=(package/rattler-build/osx/VibeCAD-*-release-evidence/vibecad-macos-update.json)
          package/scripts/sign_update_manifest.sh "${manifest[0]}" "${key}" "${manifest[0]}.sig"
          openssl pkey -in "${key}" -pubout -out "${RUNNER_TEMP}/update-public.pem"
          openssl base64 -d -A -in "${manifest[0]}.sig" -out "${RUNNER_TEMP}/update-signature.bin"
          openssl dgst -sha256 -verify "${RUNNER_TEMP}/update-public.pem" \
            -signature "${RUNNER_TEMP}/update-signature.bin" "${manifest[0]}"

      - name: Verify macOS release contents
        shell: bash
        env:
          EXPECTED_APPLICATION_NAME: VibeCAD
          EXPECTED_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          EXPECTED_SOURCE_URI: https://github.com/${{ github.repository }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED_BUILD_TYPE: https://vibecad.dev/build-types/macos-release/v1
          EXPECTED_UPDATE_CHANNEL: prerelease
        run: |
          set -euo pipefail
          dmg=(package/rattler-build/osx/VibeCAD-*.dmg)
          pkg=(package/rattler-build/osx/VibeCAD-*.pkg)
          evidence=(package/rattler-build/osx/VibeCAD-*-release-evidence)
          production=()
          if [[ "${{ inputs.sign_release }}" == "true" ]]; then
            production+=(--production)
          fi
          python3 tools/verify_macos_release.py \
            --dmg "${dmg[0]}" --pkg "${pkg[0]}" \
            --evidence-dir "${evidence[0]}" \
            --expected-application-name "${EXPECTED_APPLICATION_NAME}" \
            --expected-release-version "${EXPECTED_RELEASE_VERSION}" \
            --expected-source-uri "${EXPECTED_SOURCE_URI}" \
            --expected-source-sha "${EXPECTED_SOURCE_SHA}" \
            --expected-builder-id "${EXPECTED_BUILDER_ID}" \
            --expected-build-type "${EXPECTED_BUILD_TYPE}" \
            --expected-update-channel "${EXPECTED_UPDATE_CHANNEL}" \
            "${production[@]}"

      - name: Install and test generated macOS package
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          installed_app="/Applications/VibeCAD.app"
          install_marker="${RUNNER_TEMP}/vibecad-clean-install-owned"
          smoke_root="${RUNNER_TEMP}/vibecad-clean-install-smoke"
          packages=(package/rattler-build/osx/VibeCAD-*.pkg)
          if [[ "${#packages[@]}" -ne 1 || ! -f "${packages[0]}" ]]; then
            echo "Expected exactly one generated VibeCAD PKG." >&2
            exit 1
          fi
          if [[ -e "${installed_app}" || -e "${install_marker}" || -e "${smoke_root}" ]]; then
            echo "The clean-machine test target already exists." >&2
            exit 1
          fi
          mkdir -p "${smoke_root}"
          /usr/bin/touch "${install_marker}"
          sudo /usr/sbin/installer -pkg "${packages[0]}" -target /
          app_count="$(find /Applications -maxdepth 1 -type d -name VibeCAD.app -print | wc -l | tr -d ' ')"
          if [[ "${app_count}" != "1" || ! -d "${installed_app}" ]]; then
            echo "The PKG did not install exactly one /Applications/VibeCAD.app." >&2
            exit 1
          fi
          /usr/sbin/pkgutil --pkg-info com.vibecad.desktop
          env \
            QT_QPA_PLATFORM=offscreen \
            VIBECAD_CLEAN_INSTALL_SMOKE_ROOT="${smoke_root}" \
            VIBECAD_HOME="${smoke_root}/vibecad-home" \
            VIBECAD_INSTALLED_APP_PATH="${installed_app}" \
            VIBECAD_RUN_CLEAN_INSTALL_SMOKE=1 \
            "${installed_app}/Contents/MacOS/FreeCAD" \
            --hidden \
            --user-cfg "${smoke_root}/user.cfg" \
            --system-cfg "${smoke_root}/system.cfg" \
            "${GITHUB_WORKSPACE}/tools/macos_clean_install_smoke.py"
          python3 tools/macos_clean_install_smoke.py \
            --verify-report "${smoke_root}/smoke-report.json" \
            --expected-root "${smoke_root}" \
            --expected-application "${installed_app}"

      - name: Remove clean-machine test installation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          installed_app="/Applications/VibeCAD.app"
          install_marker="${RUNNER_TEMP}/vibecad-clean-install-owned"
          if [[ "${installed_app}" != "/Applications/VibeCAD.app" ]]; then
            echo "Refusing to remove an unexpected application path." >&2
            exit 1
          fi
          if [[ -e "${installed_app}" ]]; then
            if [[ ! -f "${install_marker}" ]]; then
              echo "Refusing to remove an application that this job did not install." >&2
              exit 1
            fi
            if [[ ! -d "${installed_app}" || -L "${installed_app}" ]]; then
              echo "Refusing to remove a non-directory or symbolic link." >&2
              exit 1
            fi
            bundle_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "${installed_app}/Contents/Info.plist")"
            if [[ "${bundle_name}" != "VibeCAD" ]]; then
              echo "Refusing to remove an application that is not VibeCAD." >&2
              exit 1
            fi
            sudo /bin/rm -rf -- "${installed_app}"
          fi
          sudo /usr/sbin/pkgutil --forget com.vibecad.desktop || true
          if [[ -e "${installed_app}" ]]; then
            echo "VibeCAD test installation cleanup failed." >&2
            exit 1
          fi

      - name: Verify production signatures and notarization
        if: ${{ inputs.sign_release }}
        shell: bash
        working-directory: package/rattler-build/osx
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 VibeCAD.app
          codesign -dv --verbose=4 VibeCAD.app 2>&1 | grep -F 'Authority=Developer ID Application'
          spctl --assess --type execute --verbose=4 VibeCAD.app
          dmg=(VibeCAD-*.dmg)
          pkg=(VibeCAD-*.pkg)
          xcrun stapler validate "${dmg[0]}"
          xcrun stapler validate "${pkg[0]}"
          pkgutil --check-signature "${pkg[0]}" | grep -F 'Developer ID Installer'

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibecad-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            package/rattler-build/osx/VibeCAD-*.dmg
            package/rattler-build/osx/VibeCAD-*.dmg-SHA256.txt
            package/rattler-build/osx/VibeCAD-*.pkg
            package/rattler-build/osx/VibeCAD-*.pkg-SHA256.txt
            package/rattler-build/osx/VibeCAD-*-release-evidence/**

  publish:
    name: Publish macOS Prerelease
    needs:
      - prepare
      - macos
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vibecad-macos-*
          path: release-assets
          merge-multiple: true

      - name: Verify and publish macOS-only release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          cd release-assets
          for checksum in *-SHA256.txt; do
            sha256sum --check "${checksum}"
          done

          mapfile -t assets < <(find . -type f -print | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No macOS release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_SHA}" \
              --title "VibeCAD macOS ${RELEASE_TAG}" \
              --notes "VibeCAD macOS artifacts. Production status depends on the signing mode recorded by this workflow run." \
              --prerelease \
              "${assets[@]}"
          fi
